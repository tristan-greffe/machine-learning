<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowPP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <filter id="shadowPP" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="900" height="460" fill="#f8fafc"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">
    Max-pool vs Average-pool
  </text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#64748b">
    Même entrée 4×4 · fenêtre 2×2 · stride 2 · deux stratégies différentes
  </text>

  <!-- Input 4x4 -->
  <text x="170" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Feature map (4×4)</text>
  <g filter="url(#shadowPP)">
    <rect x="80" y="120" width="180" height="180" fill="#fff" stroke="#0891b2" stroke-width="2"/>
  </g>
  <!-- Cells -->
  <g stroke="#cbd5e1">
    <line x1="125" y1="120" x2="125" y2="300"/>
    <line x1="170" y1="120" x2="170" y2="300"/>
    <line x1="215" y1="120" x2="215" y2="300"/>
    <line x1="80" y1="165" x2="260" y2="165"/>
    <line x1="80" y1="210" x2="260" y2="210"/>
    <line x1="80" y1="255" x2="260" y2="255"/>
  </g>
  <!-- Quadrant highlight (top-left 2x2) -->
  <rect x="80" y="120" width="90" height="90" fill="#fef3c7" fill-opacity="0.6"/>
  <rect x="170" y="120" width="90" height="90" fill="#dbeafe" fill-opacity="0.6"/>
  <rect x="80" y="210" width="90" height="90" fill="#dcfce7" fill-opacity="0.6"/>
  <rect x="170" y="210" width="90" height="90" fill="#fce7f3" fill-opacity="0.6"/>
  <g font-size="16" fill="#0f172a" font-weight="600" font-family="ui-monospace">
    <text x="102" y="150" text-anchor="middle">1</text>
    <text x="147" y="150" text-anchor="middle">3</text>
    <text x="192" y="150" text-anchor="middle">2</text>
    <text x="237" y="150" text-anchor="middle">4</text>
    <text x="102" y="195" text-anchor="middle">5</text>
    <text x="147" y="195" text-anchor="middle" fill="#dc2626" font-weight="800">9</text>
    <text x="192" y="195" text-anchor="middle">1</text>
    <text x="237" y="195" text-anchor="middle" fill="#dc2626" font-weight="800">8</text>
    <text x="102" y="240" text-anchor="middle">2</text>
    <text x="147" y="240" text-anchor="middle">1</text>
    <text x="192" y="240" text-anchor="middle">3</text>
    <text x="237" y="240" text-anchor="middle" fill="#dc2626" font-weight="800">7</text>
    <text x="102" y="285" text-anchor="middle">4</text>
    <text x="147" y="285" text-anchor="middle" fill="#dc2626" font-weight="800">6</text>
    <text x="192" y="285" text-anchor="middle">2</text>
    <text x="237" y="285" text-anchor="middle">5</text>
  </g>

  <!-- Arrow up to max -->
  <line x1="290" y1="170" x2="430" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrowPP)"/>
  <text x="360" y="160" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">max(...)</text>

  <!-- Arrow down to avg -->
  <line x1="290" y1="250" x2="430" y2="250" stroke="#475569" stroke-width="2" marker-end="url(#arrowPP)"/>
  <text x="360" y="240" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">mean(...)</text>

  <!-- Max pool output -->
  <g>
    <text x="540" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">MaxPool (2×2)</text>
    <g filter="url(#shadowPP)">
      <rect x="470" y="120" width="140" height="100" fill="#fff" stroke="#dc2626" stroke-width="2"/>
    </g>
    <g stroke="#cbd5e1"><line x1="540" y1="120" x2="540" y2="220"/></g>
    <line x1="470" y1="170" x2="610" y2="170" stroke="#cbd5e1"/>
    <g font-size="20" fill="#dc2626" font-weight="700" font-family="ui-monospace">
      <text x="505" y="155" text-anchor="middle">9</text>
      <text x="575" y="155" text-anchor="middle">8</text>
      <text x="505" y="205" text-anchor="middle">6</text>
      <text x="575" y="205" text-anchor="middle">7</text>
    </g>
    <text x="540" y="252" text-anchor="middle" font-size="11" font-family="ui-monospace" fill="#475569">prend le maximum</text>
  </g>

  <!-- Avg pool output -->
  <g>
    <text x="540" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">AveragePool (2×2)</text>
    <g filter="url(#shadowPP)">
      <rect x="470" y="300" width="140" height="100" fill="#fff" stroke="#059669" stroke-width="2"/>
    </g>
    <g stroke="#cbd5e1"><line x1="540" y1="300" x2="540" y2="400"/></g>
    <line x1="470" y1="350" x2="610" y2="350" stroke="#cbd5e1"/>
    <g font-size="18" fill="#059669" font-weight="700" font-family="ui-monospace">
      <text x="505" y="335" text-anchor="middle">4.5</text>
      <text x="575" y="335" text-anchor="middle">3.75</text>
      <text x="505" y="385" text-anchor="middle">3.25</text>
      <text x="575" y="385" text-anchor="middle">4.25</text>
    </g>
    <text x="540" y="427" text-anchor="middle" font-size="11" font-family="ui-monospace" fill="#475569">prend la moyenne</text>
  </g>

  <!-- Right legend -->
  <g>
    <rect x="650" y="110" width="220" height="300" rx="8" fill="#fff" stroke="#e2e8f0"/>
    <text x="760" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Quand utiliser quoi ?</text>

    <text x="665" y="170" font-size="12" font-weight="700" fill="#dc2626">MaxPool</text>
    <text x="665" y="190" font-size="11" fill="#475569">- Conserve les activations fortes</text>
    <text x="665" y="208" font-size="11" fill="#475569">- Idéal pour la détection</text>
    <text x="665" y="226" font-size="11" fill="#475569">- Le défaut dans 90% des CNN</text>

    <text x="665" y="266" font-size="12" font-weight="700" fill="#059669">AveragePool</text>
    <text x="665" y="286" font-size="11" fill="#475569">- Lisse les feature maps</text>
    <text x="665" y="304" font-size="11" fill="#475569">- Utilisé en sortie de ResNet</text>
    <text x="665" y="322" font-size="11" fill="#475569">- (global avg pool avant classif)</text>

    <text x="665" y="362" font-size="12" font-weight="700" fill="#0891b2">Aucun paramètre</text>
    <text x="665" y="382" font-size="11" fill="#475569">- Pas de poids à apprendre</text>
    <text x="665" y="400" font-size="11" fill="#475569">- Calcul rapide</text>
  </g>
</svg>
